name: Publicar en GitHub Pages

on:
  push:
    branches:
      - main
      - claude/health-tracking-mobile-app-9te0yr
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue por vez; no se cancela el que está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          # Activa Pages en el repositorio si todavía no lo estaba,
          # así no hace falta tocar nada a mano en los ajustes.
          enablement: true

      - name: Subir los archivos de la app
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4
